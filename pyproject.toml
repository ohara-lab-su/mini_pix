[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mini_pix"

version = "0.0.0"

description = "cobotta ctrl server2 (using ORiN2)"
authors = [
  { name="Kengo NAKADA", email="kengo.nakada@email.com" }
]
readme = "README.md"
requires-python = ">=3.7"
#requires-python = ">=3.8"
#requires-python = ">=3.11"
dependencies = [
"pytest",
"pytest-asyncio",
"x_logger",
"coloredlogs",
"colorlog",
"ese774_frame",
"setuptools",
"python-dotenv",
"fastapi",
"fastapi-utils",
"uvicorn",
"pydantic",
"starlette",
"requests",
"aiohttp",
"httpx",
#
"pyyaml",
"toml",
#
"nest_asyncio",
"sphinx",
"myst-parser",
"sphinx-autobuild",
"sphinx-rtd-theme",
"sphinxcontrib-napoleon",
"linkify-it-py",
#
]

[tool.pytest.ini_options]
pythonpath = ["src"]

# ここでpytestのiniと同じようにオプションが書ける
# 例えばテストマーク、フィルタ、カバレッジなども追記可能

[tool.black]
line-length = 88

[tool.isort]
profile = "black"