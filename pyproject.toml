[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-pix"

version = "0.1.5"

description = "Python control and gRPC device-server package for the MiniPIX two-dimensional detector."
authors = [
    { name = "Kengo NAKADA", email = "kengo.nakada@email.com" }
]
readme = "README.md"
requires-python = ">=3.7"
#requires-python = ">=3.8"
#requires-python = ">=3.11"
dependencies = [
    #"x_logger",
    "xlogger-py",
    # "ese774_frame",
    "grpc-frame",
    #
    "numpy",
    "tifffile",
    "h5py",
    #
    "coloredlogs",
    "colorlog",
    #
    #"grpc-frame==0.5.11",
    "pytest",
    "pytest-asyncio",
    #
    "setuptools",
    "python-dotenv",
    "fastapi",
    "fastapi-utils",
    "uvicorn",
    "pydantic",
    "starlette",
    "requests",
    "aiohttp",
    "httpx",
    #
    "pyyaml",
    "toml",
    #
    "nest_asyncio",
    "sphinx",
    "myst-parser",
    "sphinx-autobuild",
    "sphinx-rtd-theme",
    "sphinxcontrib-napoleon",
    "linkify-it-py",
    #
]


[project.urls]
Homepage = "https://ohara-lab-su.github.io/mini_pix/"
Documentation = "https://ohara-lab-su.github.io/mini_pix/"
Repository = "https://github.com/ohara-lab-su/mini_pix"
Issues = "https://github.com/ohara-lab-su/mini_pix/issues"

[project.optional-dependencies]
view = [
    "PyQt5",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

# ここでpytestのiniと同じようにオプションが書ける
# 例えばテストマーク、フィルタ、カバレッジなども追記可能

[tool.black]
line-length = 88

[tool.isort]
profile = "black"